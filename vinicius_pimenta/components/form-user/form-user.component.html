<div class="top-div"><h1>Criar Úsuario</h1></div>


<form [formGroup]="form" (ngSubmit)="submit()">
  <div>
    <label>Nome:</label>
    <input formControlName="name" type="text" placeholder="Nome" />
    <div *ngIf="form.get('name')?.touched && form.get('name')?.invalid" style="color: red;">
      <small *ngIf="form.get('name')?.errors?.['required']">O nome é obrigatório.</small>
      <small *ngIf="form.get('name')?.errors?.['minlength']">Deve ter no mínimo 3 caracteres.</small>
    </div>
  </div>

  <div>
    <label>Idade:</label>
    <input type="number" formControlName="age" placeholder="Idade" />
    <div *ngIf="form.get('age')?.touched && form.get('age')?.invalid" style="color: red;">
      <small *ngIf="form.get('age')?.errors?.['required']">A idade é obrigatória.</small>
      <small *ngIf="form.get('age')?.errors?.['maxlength']">Deve ter no máximo 3 caracteres.</small>
      <small *ngIf="form.get('age')?.errors?.['min']">A idade deve ser maior que zero.</small>
    </div>
  </div>

  <div>
    <label>Descrição:</label>
    <input formControlName="description" type="text" placeholder="Descrição" />
    <div *ngIf="form.get('description')?.touched && form.get('description')?.invalid" style="color: red;">
      <small *ngIf="form.get('description')?.errors?.['required']">A descrição é obrigatória.</small>
      <small *ngIf="form.get('description')?.errors?.['maxlength']">Deve ter no máximo 120 caracteres.</small>
    </div>
  </div>

  <button type="submit">Criar</button>
  <button type="button" (click)="clearForm()">Limpar</button>
</form>

<div class="button-container">
  <button routerLink="" >Página Inicial</button>
  <button routerLink="/user">Visualizar Usuários</button>
</div>
